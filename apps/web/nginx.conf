server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed build assets are safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must always be revalidated so a new deploy is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single page app: unknown paths are client side routes such as /inventory.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same origin API proxy, which also avoids cross origin CORS entirely.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
