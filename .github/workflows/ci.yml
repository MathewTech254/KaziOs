name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kazios
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-session-secret-32-chars-minimum-length
  JWT_SECRET: ci-jwt-secret-32-chars-minimum-length
  BCRYPT_ROUNDS: '4'
  NODE_ENV: test
  LOG_LEVEL: error

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=dev
      # Both of these are prerequisites for type aware linting, not optional setup.
      #
      # ESLint's `-type-checked` rules read real types. Without a generated Prisma client
      # every query result resolves to `any` or `unknown`, and the rules then report
      # errors in code that is actually correct. Without the workspace packages built,
      # `@kazios/*` imports resolve to nothing for the same reason. The test jobs below
      # already do this; this job was the one place it was missing, which is why it was
      # the only job failing.
      - run: npm run prisma:generate
        working-directory: ./apps/api
      - run: npm run build:packages
      - run: npm run lint
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kazios
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run prisma:generate
        working-directory: ./apps/api
      # `migrate deploy` applies committed migrations without prompting or creating any.
      # `migrate dev` would try to generate one and is wrong here.
      - run: npm run prisma:migrate:deploy
        working-directory: ./apps/api
      - run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kazios
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=dev
      - run: npm run prisma:generate
        working-directory: ./apps/api
      - run: npm run prisma:migrate:deploy
        working-directory: ./apps/api
      - run: npm run test:integration

  build:
    name: Build All
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=dev
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t kazios-api .
      - name: Build Web image
        run: docker build -f Dockerfile.web -t kazios-web .
      - name: Build Worker image
        run: docker build -f Dockerfile.worker -t kazios-worker .