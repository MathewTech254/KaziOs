version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kazios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kazios
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kazios-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kazios-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: ["npm", "run", "dev"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kazios-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: ["npm", "run", "dev"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: kazios-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
